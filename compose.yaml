# Ariadne: local, single-user stack for rootless Podman Compose.
#   podman compose up -d        Open http://127.0.0.1:3100
# No authentication on the web UI or /mcp: loopback only.
name: ariadne2

x-podman:
  in_pod: false

services:
  app:
    image: localhost/ariadne2:${ARIADNE_VERSION:-0.3.0}
    build:
      context: .
      dockerfile: Containerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://ariadne:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/ariadne
      ARIADNE_LISTEN_HOST: 0.0.0.0
      ARIADNE_LISTEN_PORT: "3100"
      ARIADNE_ALLOWED_HOSTS: 127.0.0.1:${ARIADNE_PORT:-3100},localhost:${ARIADNE_PORT:-3100}
      # This stack is the public instance: it relays, and announces the tunnel origin.
      ARIADNE_RELAY: ${ARIADNE_RELAY:-server}
      ARIADNE_PUBLIC_URL: ${ARIADNE_PUBLIC_URL:-}
      ARIADNE_PEER_KEY_FILE: /app/secrets/peer_key
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes: [peer_key:/app/secrets]
    # Map you to the image's node user.
    userns_mode: "keep-id:uid=1000,gid=1000"
    ports:
      - "127.0.0.1:${ARIADNE_PORT:-3100}:3100"
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  postgres:
    image: artifactory.adtran.com/docker/postgres:17.6-alpine@sha256:747d5ed1fdeeb124b880fbe3d7c6557d2c4064ae41d6b6297d417882effce4be
    restart: unless-stopped
    environment:
      POSTGRES_USER: ariadne
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ariadne
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariadne -d ariadne"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Point the tunnel's public hostname at http://app:3100 (HTTP, WebSockets included).
  # The UI stays on loopback; federation uses wss://<ARIADNE_PUBLIC_URL host>/p2p.
  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      app: { condition: service_healthy }
    networks: [frontend]

networks:
  frontend: {}
  backend: { internal: true }

volumes:
  postgres_data: {}
  peer_key: {}
